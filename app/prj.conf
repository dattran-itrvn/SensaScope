# SensaPulse v1.0 — application Kconfig
# Phase 6: bring-up + BLE smoke advertise.

CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_MAIN_STACK_SIZE=4096

# SPI + SD card + filesystem
CONFIG_SPI=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_DISK_DRIVERS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_HEAP=y
CONFIG_FS_FATFS_MAX_LFN=64

# PDM digital MEMS mic stack
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# Bluetooth Low Energy (peripheral — Sync Service GATT in #19)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="SensaPulse v1"
# 833 = Generic Health Sensor appearance
CONFIG_BT_DEVICE_APPEARANCE=833
# Use SoftDevice controller (NCS default for nRF52840)
CONFIG_BT_LL_SOFTDEVICE=y

# #19 high-throughput GATT bulk transfer
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
# #34 diagnostic: macOS Core Bluetooth may not parse BT 5.2 multi-notify PDUs;
# disable so Zephyr falls back to single-notify per bt_gatt_notify call.
CONFIG_BT_GATT_NOTIFY_MULTIPLE=n
# #19.5 TX buffer count — defaults ~3 không đủ cho streaming, gây
# "bt_att: Unable to allocate buffer for op 0x1b" suốt READ. Bump để
# read_chunk_cb retry không phải chờ lâu.
CONFIG_BT_BUF_ACL_TX_COUNT=32
CONFIG_BT_L2CAP_TX_BUF_COUNT=32

# #34 DLE diagnostic kept off in production. Use these to enable HCI DBG
# traces when re-investigating Apple DLE behaviour:
#   CONFIG_BT_HCI_CORE_LOG_LEVEL_DBG=y
#   CONFIG_BT_CONN_LOG_LEVEL_DBG=y

# #34 L2CAP CoC for high-throughput bulk Data transfer.
# macOS Core Bluetooth caps GATT-notify throughput around 14 kB/s (DLE
# refused, ~8 packets per event); CoC has its own credit-based flow and
# is reported to break that ceiling on macOS.
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
# CONFIG_BT_L2CAP_DYNAMIC_CHANNEL depends on BT_SMP. Enable security manager.
CONFIG_BT_SMP=y

# Logging via Segger RTT
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# Heap for FATFS LFN + DMIC mem slab + BT
CONFIG_HEAP_MEM_POOL_SIZE=16384

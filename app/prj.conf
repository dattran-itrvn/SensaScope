# SensaPulse v1.0 — application Kconfig
# Phase 6: bring-up + BLE smoke advertise.

CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_MAIN_STACK_SIZE=4096

# SPI + SD card + filesystem
CONFIG_SPI=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_DISK_DRIVERS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_HEAP=y
CONFIG_FS_FATFS_MAX_LFN=64

# PDM digital MEMS mic stack
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# Bluetooth Low Energy (peripheral, advertise only for smoke test)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="SensaPulse v1"
# 833 = Generic Health Sensor appearance
CONFIG_BT_DEVICE_APPEARANCE=833
# Use SoftDevice controller (NCS default for nRF52840)
CONFIG_BT_LL_SOFTDEVICE=y

# Logging via Segger RTT
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# Heap for FATFS LFN + DMIC mem slab + BT
CONFIG_HEAP_MEM_POOL_SIZE=16384

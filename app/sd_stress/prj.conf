# SD stress isolation firmware — Kconfig matches production data path
# minus FSM / BLE / watchdog / LED state machine.
#
# Phases 1-4 use only SD; phases 5-6 add PDM (16 kHz/16-bit stereo) and
# IMU (LSM6DSL via I²C @ 100 kHz, sampled at 52 Hz). Anything that fails
# in 5/6 but not 1-4 is interaction-class, not SD-class.

CONFIG_GPIO=y                           # LED liveness blink
CONFIG_MAIN_STACK_SIZE=4096

# SPI + SD card + filesystem
CONFIG_SPI=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_DISK_DRIVERS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_HEAP=y
CONFIG_FS_FATFS_MAX_LFN=64

# Phase 5 — PDM stereo (production audio.c)
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# Phase 6 — I²C + LSM6DSL (production imu.c + imu_sampler.c)
CONFIG_I2C=y

# Logging via Segger RTT
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# Heap matches production (FATFS LFN + DMIC mem-slab + IMU buffers)
CONFIG_HEAP_MEM_POOL_SIZE=16384
